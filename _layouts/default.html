<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="https://github.com/scdenney/ba2_digital-korea" class="github-link" target="_blank" rel="noopener">View on GitHub</a>
        <p class="site-eyebrow">Leiden University · Korean Studies</p>
        <h1 class="site-title">{{ site.title }}</h1>
        <p class="site-description">{{ site.description }}</p>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active"{% endif %}>Home</a>
          <a href="{{ '/syllabus/syllabus.html' | relative_url }}"{% if page.url contains '/syllabus/' %} class="is-active"{% endif %}>Syllabus</a>
          <a href="{{ '/getting-started/' | relative_url }}"{% if page.url contains '/getting-started/' %} class="is-active"{% endif %}>Getting Started</a>
          <a href="{{ '/presentations/' | relative_url }}"{% if page.url contains '/presentations/' %} class="is-active"{% endif %}>Presentations</a>
          <a href="{{ '/data/' | relative_url }}"{% if page.url contains '/data/' %} class="is-active"{% endif %}>Data &amp; Scripts</a>
          <a href="{{ '/interactive/' | relative_url }}"{% if page.url contains '/interactive/' %} class="is-active"{% endif %}>Interactive</a>
          <a href="{{ '/assignments/' | relative_url }}"{% if page.url contains '/assignments/' %} class="is-active"{% endif %}>Assignments</a>
          <a href="{{ '/midterm/' | relative_url }}"{% if page.url contains '/midterm/' %} class="is-active"{% endif %}>Midterm</a>
          <a href="{{ '/final-assessment/' | relative_url }}"{% if page.url contains '/final-assessment/' %} class="is-active"{% endif %}>Final Assessment</a>
          <a href="{{ '/final-paper/' | relative_url }}"{% if page.url contains '/final-paper/' %} class="is-active"{% endif %}>Final Paper</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Korean Studies · Leiden University</p>
      </div>
    </footer>

    <script>
    (function() {
      var tocLinks = Array.prototype.slice.call(document.querySelectorAll('.page-toc a[href^="#"]'));
      if (tocLinks.length === 0) return;

      var linkById = {};
      tocLinks.forEach(function(link) {
        var id = decodeURIComponent(link.getAttribute('href').slice(1));
        if (id) linkById[id] = link;
      });

      var headings = Array.prototype.slice
        .call(document.querySelectorAll('h1[id], h2[id], h3[id], h4[id]'))
        .filter(function(h) { return Object.prototype.hasOwnProperty.call(linkById, h.id); });
      if (headings.length === 0) return;

      var OFFSET = 120;
      var lastActive = null;

      function update() {
        var current = headings[0];
        for (var i = 0; i < headings.length; i++) {
          if (headings[i].getBoundingClientRect().top <= OFFSET) {
            current = headings[i];
          } else {
            break;
          }
        }
        var activeLink = linkById[current.id];
        if (activeLink === lastActive) return;
        lastActive = activeLink;
        tocLinks.forEach(function(link) {
          if (link === activeLink) link.classList.add('is-active');
          else link.classList.remove('is-active');
        });
      }

      var ticking = false;
      function onScroll() {
        if (!ticking) {
          window.requestAnimationFrame(function() { update(); ticking = false; });
          ticking = true;
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      update();
    })();
    </script>
  </body>
</html>
